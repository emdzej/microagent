name: Release

on:
  release:
    types: [published]
  # Lets you exercise the whole build matrix without cutting a release.
  # Artifacts are uploaded to the run instead of to a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  binaries:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    strategy:
      # One broken target should not stop the others from publishing.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            # `macos-13` was retired as a hosted label and queues forever with no
            # runner assigned; `macos-15-intel` is the current Intel image.
            # Building natively rather than cross-compiling from arm64, because
            # the tree pulls aws-lc-sys and cmake — cross-building C from Apple
            # Silicon is a risk not worth taking for one target.
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
        # aarch64-unknown-linux-gnu is omitted deliberately: it needs either a
        # cross-compilation toolchain or an arm64 runner. Add it with
        # `{ target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }` once
        # you have confirmed that runner label is available to this repository.

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # Released binaries embed the web UI, so `microagent ui` is one
      # self-contained file with no Node runtime. rust-embed resolves this folder
      # at compile time, so it must exist before cargo runs.
      - name: Build web assets
        run: pnpm --filter @microagent/web build

      - name: Build
        run: >
          cargo build --release --locked
          -p microagent-cli
          --features embed-web
          --target ${{ matrix.target }}
        working-directory: rust

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          # On a release this is the tag; on workflow_dispatch there is no tag, so
          # fall back to a short SHA rather than the full 40 characters.
          version="${{ github.event.release.tag_name }}"
          version="${version:-$(git rev-parse --short HEAD)}"
          name="microagent-${version}-${{ matrix.target }}"
          bin_dir="rust/target/${{ matrix.target }}/release"

          mkdir -p dist "staging/${name}"
          cp README.md rust/README.md docs/RUST_PORT_PLAN.md "staging/${name}/" || true

          if [ "${{ runner.os }}" = "Windows" ]; then
            cp "${bin_dir}/microagent.exe" "staging/${name}/"
            (cd staging && 7z a -tzip "../dist/${name}.zip" "${name}") > /dev/null
            archive="${name}.zip"
          else
            cp "${bin_dir}/microagent" "staging/${name}/"
            tar -czf "dist/${name}.tar.gz" -C staging "${name}"
            archive="${name}.tar.gz"
          fi

          # Checksums, so a download can be verified.
          cd dist
          if command -v sha256sum > /dev/null; then
            sha256sum "${archive}" > "${archive}.sha256"
          else
            shasum -a 256 "${archive}" > "${archive}.sha256"
          fi

          echo "archive=${archive}" >> "$GITHUB_OUTPUT"

      - name: Upload to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          "dist/${{ steps.package.outputs.archive }}"
          "dist/${{ steps.package.outputs.archive }}.sha256"
          --clobber

      # On workflow_dispatch there is no release to attach to, so keep the
      # artifacts on the run for inspection.
      - name: Upload as a run artifact
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
